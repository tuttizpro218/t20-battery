# Add to ~/.config/polybar/<your-theme>/user_modules.ini (or any included ini):

[module/t20]
type = custom/script

; HXSJ T20 mouse battery, read on demand from the receiver dongle (1EA7:0066)
exec = ~/.local/bin/t20-battery
interval = 15

format = <label>
label = %output%

# Then add `t20` to the bar's module list, e.g.:
#   modules-right = ... date t20 power
#
# The script emits polybar formatting itself (%{F...} colors), so no extra
# format-* keys are needed. The icon uses Iosevka Nerd Font's mouse glyph
# (U+F245); with --plain you get "T20 96%" instead.
